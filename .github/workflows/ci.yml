name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          checksum: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
          download-from-astral-mirror: false
          enable-cache: false
          python-version: "3.12"

      - name: Install Socket Firewall
        env:
          SFW_SHA256: 4dc46b626a7c5b81c0b54e1984ee53be5a628dbfb2f55ab14e9b04c8a134db6a
          SFW_URL: https://github.com/SocketDev/sfw-free/releases/download/v1.13.1/sfw-free-linux-x86_64
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$SFW_URL" \
            --output "$RUNNER_TEMP/sfw"
          echo "$SFW_SHA256  $RUNNER_TEMP/sfw" | sha256sum --check -
          install -m 0755 "$RUNNER_TEMP/sfw" "$RUNNER_TEMP/bin/sfw"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install lychee
        env:
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
          LYCHEE_URL: https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$LYCHEE_URL" \
            --output "$RUNNER_TEMP/lychee.tar.gz"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$RUNNER_TEMP/lychee.tar.gz" \
            --directory "$RUNNER_TEMP/bin" --strip-components=1 \
            lychee-x86_64-unknown-linux-gnu/lychee

      - name: Sync locked dependencies
        run: sfw uv sync --frozen --group dev

      - name: Audit action pins
        run: uv run --no-sync python scripts/check_action_pins.py

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Test
        run: uv run --no-sync python -m pytest

      - name: Verify generated manifest
        run: uv run --no-sync python scripts/build_manifest.py --check

      - name: Verify reproducible release payload
        run: |
          uv run --no-sync python scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/release-a"
          uv run --no-sync python scripts/build_release.py \
            --output-dir "$RUNNER_TEMP/release-b"
          diff --recursive --brief \
            "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

      - name: Check local Markdown links
        run: |
          lychee \
            --offline \
            --no-progress \
            --include-fragments \
            --root-dir "$GITHUB_WORKSPACE" \
            './**/*.md'
